<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Nunito:wght@700&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }
      body {
        background: radial-gradient(
          90% 120% at 78% 50%,
          #6b6bff 0%,
          #4b4bf0 50%,
          #3636cf 100%
        );
        font-family: 'Bricolage Grotesque', sans-serif;
        position: relative;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 50%;
        transform: translateY(-50%);
        color: #fff;
        width: 520px;
      }
      .name {
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -0.01em;
        opacity: 0.92;
      }
      h1 {
        font-weight: 800;
        font-size: 84px;
        line-height: 0.98;
        letter-spacing: -0.025em;
        margin-top: 14px;
        text-wrap: balance;
      }
      h1 em {
        font-style: normal;
        color: #ffd23f;
      }
      .k {
        position: absolute;
        right: 56px;
        bottom: -8px;
        height: 470px;
      }
      .halo {
        position: absolute;
        right: 40px;
        top: 50%;
        width: 420px;
        height: 420px;
        transform: translateY(-50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.22),
          rgba(255, 255, 255, 0) 68%
        );
      }
      .spark {
        position: absolute;
        background: #ffd23f;
        clip-path: polygon(
          50% 0,
          62% 38%,
          100% 50%,
          62% 62%,
          50% 100%,
          38% 62%,
          0 50%,
          38% 38%
        );
      }
    </style>
  </head>
  <body>
    <div class="halo"></div>
    <img class="k" src="../../../../public/images/kanko/kanko-hello.webp" />
    <div
      class="spark"
      style="width: 30px; height: 30px; top: 64px; right: 420px"
    ></div>
    <div
      class="spark"
      style="width: 18px; height: 18px; top: 120px; right: 70px; opacity: 0.85"
    ></div>
    <div class="text">
      <div class="name">Canker Core</div>
      <h1>Know if it&rsquo;s <em>healing</em></h1>
    </div>
  </body>
</html>
